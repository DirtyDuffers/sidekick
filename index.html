<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#233821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sidekick">
<meta name="mobile-web-app-capable" content="yes">
<title>Sidekick — Dog Training</title>
<meta name="description" content="A calm, reward-based training companion for you and your dog.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ============================================================
   SIDEKICK — Design tokens
   Palette: field-guide canvas, not SaaS-card / not cream+terracotta
   ============================================================ */
:root{
  /* Core palette */
  --canvas:      #F5F1E6;   /* warm bone paper */
  --canvas-raised:#FFFFFF;
  --ink:         #1E2A1F;   /* near-black forest ink, not pure black */
  --ink-soft:    #4B5A4A;
  --line:        #D9D2BF;   /* hairline rule on paper */
  --forest:      #2F5233;   /* primary — deep forest green */
  --forest-dark: #1F3A24;
  --ochre:       #986E22;   /* secondary accent — mustard/ochre, not terracotta (darkened from C08A2B for WCAG AA with white text) */
  --ochre-soft:  #EFDFB8;
  --ochre-text:  #8A6015;   /* darker than --ochre specifically for small text-on-canvas use (4.9:1 vs --ochre's 4.06:1) */
  --sky:         #3E6E82;   /* tertiary accent — muted teal-blue, sparse use */
  --red:         #B23A2E;   /* functional only: safety gates / errors */
  --red-soft:    #F3DED9;
  --amber:       #986E22;
  --amber-soft:  #F5E7C8;
  --green-ok:    #2F5233;
  --green-soft:  #DCE6D5;

  /* Category tab colors (lesson categories get a consistent identity strip) */
  --cat-foundation:#2F5233;
  --cat-com:      #3E6E82;
  --cat-basic:    #6B4E9A;
  --cat-life:     #986E22;
  --cat-calm:     #4E7A8C;
  --cat-walk:     #8A6D3A;
  --cat-recall:   #2F7A5C;
  --cat-social:   #A05A9E;
  --cat-care:     #4E7A5A;
  --cat-home:     #7A5C3E;
  --cat-alone:    #5A6E8C;
  --cat-bark:     #B0612D;
  --cat-chew:     #8C5A3E;
  --cat-guard:    #B23A2E;
  --cat-chase:    #7A3E5A;
  --cat-react:    #A83E3E;
  --cat-enrich:   #3A8367;
  --cat-tricks:   #986E22;
  --cat-owner:    #4B5A4A;
  --cat-assess:   #3E6E82;
  --cat-safety:   #B23A2E;
  --cat-advanced: #1F3A24;
  --cat-trouble:  #8C3E5A;
  --cat-mouth:    #9C4F63;

  --radius-s: 12px;
  --radius-m: 18px;
  --radius-pill: 999px;
  --shadow-card: 0 2px 10px rgba(30,42,31,0.07), 0 1px 2px rgba(30,42,31,0.04);

  --font-display: 'Space Grotesk', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}

/* ---------- Dark theme ----------
   Only the structural tokens shift (canvas/ink/line/forest-for-buttons).
   Badge/banner pastel backgrounds (ochre-soft, red-soft, amber-soft,
   green-soft) are deliberately left as light chips even in dark mode —
   common pattern for alert/status colors, and they already carry their
   own dark text so contrast holds regardless of the page background.
   Category tab colors are mid-saturation and read fine unchanged too. */
body[data-theme="dark"]{
  --canvas:       #1B211C;
  --canvas-raised:#232B25;
  --ink:          #ECE8DC;
  --ink-soft:     #9FAA9C;
  --line:         #384034;
  --forest:       #4C8058;
  --forest-dark:  #3A6644;
  --ochre-text:   #C08A2B;
  --shadow-card:  0 2px 10px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.2);
}
@media (prefers-color-scheme: dark){
  body[data-theme="auto"]{
    --canvas:       #1B211C;
    --canvas-raised:#232B25;
    --ink:          #ECE8DC;
    --ink-soft:     #9FAA9C;
    --line:         #384034;
    --forest:       #4C8058;
    --forest-dark:  #3A6644;
    --ochre-text:   #C08A2B;
    --shadow-card:  0 2px 10px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.2);
  }
}

/* Logo lockup — swaps between light/dark-background versions the same way
   the color tokens above do, so it's never the wrong-contrast image. */
.logo-lockup-dark{display:none;}
body[data-theme="dark"] .logo-lockup-light{display:none;}
body[data-theme="dark"] .logo-lockup-dark{display:inline-block;}
@media (prefers-color-scheme: dark){
  body[data-theme="auto"] .logo-lockup-light{display:none;}
  body[data-theme="auto"] .logo-lockup-dark{display:inline-block;}
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:76px; /* space for tab bar */
  min-height:100vh;
  transition:background-color 0.2s ease, color 0.2s ease;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:600;
  margin:0 0 8px 0;
  letter-spacing:-0.01em;
}
p{margin:0 0 12px 0;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--ochre-soft);}

/* Focus visibility */
:focus-visible{outline:2px solid var(--sky); outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- App frame ---------- */
#app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; background:var(--canvas);}

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--canvas);
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
}
.topbar h1{font-size:20px; margin:0;}
.topbar .sub{font-size:13px; color:var(--ink-soft); margin-top:1px;}
.topbar-logo{
  flex:none; width:30px; height:30px; border-radius:50%; border:none; background:none;
  padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.topbar-logo:active{opacity:0.7;}
#topbarLogoFull{width:auto; max-width:150px; border-radius:8px;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  width:36px;height:36px; border-radius:50%; border:1px solid var(--line);
  background:var(--canvas-raised); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; flex:none;
}
.icon-btn:active{background:var(--ochre-soft);}

.screen{padding:16px 20px 32px; display:none;}
.screen.active{display:block;}

/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--canvas-raised);
  border-top:1px solid var(--line);
  display:flex;
  max-width:560px; margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:9px 4px 8px; background:none; border:none; cursor:pointer;
  color:var(--ink-soft); font-size:10.5px; font-family:var(--font-body); font-weight:600;
  letter-spacing:0.01em;
}
.tab .tab-icon{width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
.tab .tab-icon svg{width:100%; height:100%;}
.tab.active{color:var(--forest);}
.tab.active .tab-icon svg{transform:translateY(-1px);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:13px 22px; border-radius:var(--radius-pill); border:1px solid transparent;
  font-family:var(--font-body); font-weight:600; font-size:15px; cursor:pointer;
  text-decoration:none;
}
.btn-primary{background:var(--forest); color:#fff; box-shadow:0 2px 8px rgba(47,82,51,0.25);}
.btn-primary:active{background:var(--forest-dark); box-shadow:none;}
.btn-secondary{background:transparent; color:var(--forest); border-color:var(--forest);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
.btn-danger{background:transparent; color:var(--red); border-color:var(--red);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px; font-size:13px;}
.btn:disabled{opacity:0.4; cursor:default; box-shadow:none;}

/* ---------- Cards & list rows (field-guide index, not SaaS cards) ---------- */
.card{
  background:var(--canvas-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);
  padding:18px;
  margin-bottom:12px;
}
.row-list{border-top:1px solid var(--line);}
.row{
  display:flex; align-items:center; gap:12px;
  padding:13px 2px;
  border-bottom:1px solid var(--line);
  cursor:pointer; background:none; border-left:none; border-right:none; border-top:none;
  width:100%; text-align:left; font-family:inherit; color:inherit;
}
.row:active{background:var(--ochre-soft);}
.row-tab{width:4px; align-self:stretch; border-radius:2px; flex:none;}
.row-body{flex:1; min-width:0;}
.row-title{font-weight:600; font-size:15px; margin-bottom:2px;}
.row-meta{font-size:12.5px; color:var(--ink-soft); display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.row-chev{color:var(--line); font-size:18px; flex:none;}

.badge{
  display:inline-flex; align-items:center; gap:3px;
  font-size:11px; font-weight:600; padding:2px 7px; border-radius:var(--radius-pill);
  background:var(--ochre-soft); color:var(--forest-dark); white-space:nowrap;
}
.badge-red{background:var(--red-soft); color:var(--red);}
.badge-outline{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}

.section-label{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--ink-soft); margin:22px 0 8px; display:flex; align-items:center; justify-content:space-between;
}
.section-label:first-child{margin-top:0;}

.empty-state{
  text-align:center; padding:48px 20px; color:var(--ink-soft);
}
.empty-state .glyph{font-size:36px; display:block; margin-bottom:10px;}

/* ---------- Forms ---------- */
label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
input[type=text],input[type=number],select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-s);
  font-family:inherit; font-size:15px; background:var(--canvas-raised); color:var(--ink);
  margin-bottom:14px;
}
textarea{resize:vertical; min-height:70px;}
.field-row{display:flex; gap:10px;}
.field-row > *{flex:1;}
.chip-group{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.chip{
  padding:8px 14px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--canvas-raised);
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.chip.selected{background:var(--forest); border-color:var(--forest); color:#fff;}

/* ---------- Misc ---------- */
.divider{height:1px; background:var(--line); margin:16px 0; border:none;}
.hairline-top{border-top:1px solid var(--line);}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
.stat-box{background:var(--canvas-raised); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-card); padding:14px 10px; text-align:center;}
.heatmap-grid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 1fr); gap:3px;}
.heatmap-cell{width:100%; aspect-ratio:1; border-radius:2px; background:var(--line);}
.game-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
.game-tile{background:none; border:none; padding:0; cursor:pointer; text-align:center; position:relative;}
.game-tile-thumb{width:100%; aspect-ratio:1; border-radius:50%; overflow:hidden; box-shadow:var(--shadow-card); margin-bottom:8px;}
.game-tile-label{font-size:13px; font-weight:600; color:var(--ink); line-height:1.3;}
.game-tile-done{position:absolute; top:0; right:14%; background:var(--forest); color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px;}
.heatmap-cell.trained{background:var(--forest);}
.heatmap-cell.future{background:transparent;}
.stat-box .num{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--forest);}
.stat-box .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}

.banner{
  display:flex; gap:10px; padding:12px 14px; border-radius:var(--radius-m); margin-bottom:14px; font-size:13.5px;
  border:1px solid;
}
.banner-red{background:var(--red-soft); border-color:#e0b8b0; color:var(--red);}
.banner-amber{background:var(--amber-soft); border-color:#e3c98a; color:#7a5613;}
.banner-green{background:var(--green-soft); border-color:#b9cca9; color:var(--forest-dark);}
.banner .glyph{flex:none; font-size:17px;}

.progress-track{height:7px; background:var(--line); border-radius:8px; overflow:hidden; margin:6px 0;}
.progress-fill{height:100%; background:var(--forest); border-radius:8px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(30,42,31,0.45); z-index:100;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal-sheet{
  background:var(--canvas); width:100%; max-width:560px; border-radius:16px 16px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  position:relative;
}
.modal-sheet .handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px;}
.modal-close{
  position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
  border:none; background:var(--canvas-raised); color:var(--ink); font-size:22px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:1;
}

.toast{
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--canvas); padding:10px 18px; border-radius:24px;
  font-size:13.5px; font-weight:600; z-index:200; opacity:0; pointer-events:none;
  transition:opacity 0.2s ease;
}
.toast.show{opacity:1;}

.avatar{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:20px; flex:none; font-weight:700; color:#fff;
}
.avatar-lg{width:72px; height:72px; font-size:32px;}

.step-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:flex-start; border-radius:10px; transition:background-color 0.3s ease;}
.step-item.step-active{background:var(--ochre-soft); color:var(--forest-dark); margin:0 -10px; padding:10px; border-bottom-color:transparent;}
.step-item:last-child{border-bottom:none;}
.step-num{
  width:24px; height:24px; border-radius:50%; background:var(--forest); color:#fff;
  font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;
}
.step-num-lg{
  width:30px; height:30px; border-radius:50%; color:#fff;
  font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
  font-family:var(--font-display);
}
.lesson-hero-fallback{
  width:100%; aspect-ratio:16/9; border-radius:var(--radius-m); margin-bottom:14px;
  display:flex; align-items:center; justify-content:center; font-size:52px;
}

/* ---------- Reusable concept diagrams (for lessons with no photo/video yet) ---------- */
.concept-diagram{
  width:100%; aspect-ratio:16/9; border-radius:var(--radius-m); margin-bottom:14px;
  background:var(--canvas-raised); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
}
.concept-beat{
  position:absolute; display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; font-size:13px; font-weight:700; color:var(--forest); text-align:center; padding:0 20px;
}
.concept-beat svg{width:20vw; height:20vw; max-width:56px; max-height:56px;}
.concept-beat.b1{animation:conceptCycle 6s infinite;}
.concept-beat.b2{animation:conceptCycle 6s infinite; animation-delay:2s;}
.concept-beat.b3{animation:conceptCycle 6s infinite; animation-delay:4s;}
@keyframes conceptCycle{
  0%{opacity:0; transform:scale(0.85);}
  6%{opacity:1; transform:scale(1);}
  28%{opacity:1; transform:scale(1);}
  34%{opacity:0; transform:scale(0.85);}
  100%{opacity:0;}
}
@media (prefers-reduced-motion: reduce){
  .concept-beat{animation:none !important; opacity:1 !important; position:static !important;}
  .concept-diagram{flex-wrap:wrap; gap:16px; padding:14px;}
}
.checklist-item{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px; color:var(--ink-soft);}
.checklist-item .dot{width:5px; height:5px; border-radius:50%; background:var(--ink-soft); flex:none;}

.search-input-wrap{position:relative; margin-bottom:14px;}
.search-input-wrap input{padding-left:36px;}
.search-input-wrap .sicon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-soft);}

.link-pill{
  display:inline-block; padding:6px 12px; border:1px solid var(--line); border-radius:var(--radius-pill);
  font-size:12.5px; margin:0 6px 6px 0; cursor:pointer; color:var(--forest-dark); background:var(--canvas-raised);
}

/* ---------- Printable training log ---------- */
.print-overlay{
  position:fixed; inset:0; z-index:500; background:var(--canvas);
  overflow-y:auto;
}
.print-toolbar{
  position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; gap:10px;
  padding:12px 16px; background:var(--canvas-raised); border-bottom:1px solid var(--line);
}
.print-page{
  max-width:640px; margin:0 auto; padding:24px 20px 60px; color:var(--ink);
}
.print-page h1{font-size:22px; margin-bottom:2px;}
.print-page .print-sub{color:var(--ink-soft); font-size:13px; margin-bottom:20px;}
.print-page h2{font-size:16px; margin-top:26px; border-bottom:1px solid var(--line); padding-bottom:6px;}
.print-page h3{font-size:13px; color:var(--ink-soft); margin-top:16px; margin-bottom:4px;}
.print-table{width:100%; border-collapse:collapse; margin-bottom:8px; font-size:13px;}
.print-table td, .print-table th{padding:6px 4px; border-bottom:1px solid var(--line); text-align:left;}
.print-table th{font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);}
.print-table-wide{font-size:12px;}
.print-footer{text-align:center; color:var(--ink-soft); font-size:11px; margin-top:30px;}
.report-stat-row{display:flex; gap:10px; margin-top:14px;}
.report-stat{flex:1; text-align:center; background:var(--canvas-raised); border-radius:12px; padding:12px 6px;}
.report-stat .num{font-size:22px; font-weight:700; font-family:var(--font-display); color:var(--forest);}
.report-stat .lbl{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}

@media print{
  #app, .toast, .modal-overlay{ display:none !important; }
  .no-print{ display:none !important; }
  .print-overlay{ position:static; overflow:visible; background:#fff; }
  .print-page{ color:#000; max-width:none; }
  .print-page h2{ break-after:avoid; }
  .print-table tr{ break-inside:avoid; }
  .report-stat{ border:1px solid #ccc; break-inside:avoid; }
  .report-stat .num{ color:#000; }
  body{ padding-bottom:0; }
  .certificate-page{ size:landscape; aspect-ratio:1.6/1; max-width:none; }
  .certificate-inner{ padding:40px 60px; }
  @page{ margin:0.3in; }
}

.certificate-page{
  width:100%; max-width:900px; margin:20px auto;
  border:3px solid #2F5233; padding:12px; box-sizing:border-box;
}
.certificate-inner{
  position:relative; overflow:hidden;
  border:1.5px solid #986E22; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:36px 24px; font-family:var(--font-body);
  background:#FBF8F0;
}
.certificate-bg-watermark{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:100%; height:100%; object-fit:cover; opacity:0.07; z-index:0; pointer-events:none;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.certificate-holo{position:absolute; bottom:14px; right:16px; width:50px; height:50px; z-index:1;}
.certificate-logo{position:absolute; top:14px; left:16px; height:22px; width:auto; z-index:1;}
.certificate-title{position:relative; z-index:1; font-family:var(--font-display); font-size:26px; color:#2F5233; margin:0 0 2px; letter-spacing:0.01em;}
.certificate-sub{position:relative; z-index:1; font-size:13px; color:#8a8a7a; text-transform:uppercase; letter-spacing:0.15em; margin-bottom:28px;}
.certificate-awardedto{position:relative; z-index:1; font-size:12px; color:#8a8a7a; text-transform:uppercase; letter-spacing:0.15em; margin-bottom:8px;}
.certificate-dogname{position:relative; z-index:1; font-family:var(--font-display); font-size:52px; color:#986E22; margin:0 0 28px; border-bottom:2px solid #986E22; display:inline-block; padding:0 24px 10px;}
.certificate-body{position:relative; z-index:1; font-size:15px; color:#333; max-width:560px; line-height:1.6; margin-bottom:32px;}
.certificate-signoff{position:relative; z-index:1; text-align:center; margin-bottom:28px;}
.certificate-sig-img{height:46px; width:auto; display:block; margin:0 auto;}
.certificate-sig-text{font-family:'Caveat', cursive; font-size:34px; color:#1F3A24; line-height:1;}
.certificate-sig-line{border-top:1px solid #999; margin-top:2px; padding-top:3px; font-size:11px; color:#777; min-width:120px;}
.certificate-footer{position:relative; z-index:1; text-align:center; font-size:11px; letter-spacing:0.08em; color:#888; text-transform:uppercase; padding:0 46px;}
</style>
</head>
<body data-theme="auto">
<div id="app">

  <!-- ===================== TOP BAR ===================== -->
  <div class="topbar" id="topbar">
    <button class="topbar-logo" id="topbarLogo" aria-label="Sidekick home" title="Home">
      <img src="images/icon-topbar.png" alt="" aria-hidden="true" width="30" height="30" style="width:30px; height:30px; display:block;">
    </button>
    <button class="topbar-logo" id="topbarLogoFull" aria-label="Sidekick home" title="Home" style="display:none; padding:0;">
      <img src="images/logo-lockup-light.png" alt="Sidekick" class="logo-lockup-light" style="height:34px; width:auto;">
      <img src="images/logo-lockup-dark.png" alt="Sidekick" class="logo-lockup-dark" style="height:34px; width:auto;">
    </button>
    <div style="flex:1; min-width:0;" id="topbarTitleWrap">
      <h1 id="topbarTitle">Sidekick</h1>
      <div class="sub" id="topbarSub">Reward-based training</div>
    </div>
    <div class="topbar-actions" id="topbarActions"></div>
    <button class="icon-btn" id="topbarThemeToggle" aria-label="Switch to dark mode" title="Toggle dark mode" style="flex:none;">🌙</button>
    <button class="icon-btn" id="topbarAboutBtn" aria-label="About Sidekick" title="About" style="flex:none;">❓</button>
  </div>

  <!-- ===================== SCREENS ===================== -->
  <div id="screens"></div>

  <!-- ===================== TAB BAR ===================== -->
  <div class="tabbar" id="tabbar">
    <button class="tab active" data-screen="home"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg></span>Home</button>
    <button class="tab" data-screen="lessons"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c0-.6.4-1 1-1h5.5a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 5.5c0-.6-.4-1-1-1h-5.5a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5H20z"/></svg></span>Train</button>
    <button class="tab" data-screen="behaviours"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-5 2 2-5z"/></svg></span>Behaviour</button>
    <button class="tab" data-screen="progress"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15l4-5 3 3 5-7"/><path d="M14 6h4v4"/></svg></span>Progress</button>
    <button class="tab" data-screen="profile"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"/></svg></span>Profile</button>
    <button class="tab" data-screen="settings"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.04 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1.04-1.56V4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.56 1.04H20a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04z"/></svg></span>Settings</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
